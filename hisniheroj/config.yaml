name: HišniHeroj
version: "0.6.0"
slug: hisniheroj
description: Družinska opravila, točke in nagrade (PWA)
url: https://github.com/TadejBartol/hisniheroj-addon
arch:
  - aarch64
  - amd64
image: ghcr.io/tadejbartol/hisniheroj-{arch}
init: false
startup: application
boot: auto
ports:
  3000/tcp: 8270
ports_description:
  3000/tcp: Spletna aplikacija in API (za Cloudflare Tunnel)
watchdog: http://[HOST]:[PORT:3000]/api/health
# skrbniški pregled strežnika (domovi, uporabniki, brisanje) – samo za skrbnike HA
ingress: true
ingress_port: 8099
panel_icon: mdi:home-heart
panel_title: HišniHeroj
panel_admin: true
backup: hot
options:
  base_url: https://hisniheroj.gbartol.com
  smtp_url: ""
  mail_from: HišniHeroj <no-reply@gbartol.com>
schema:
  base_url: url
  smtp_url: password?
  mail_from: str?
  require_email_verification: bool?
  google_client_id: str?
  google_client_secret: password?
